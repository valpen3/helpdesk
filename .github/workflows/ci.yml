name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/common[dev]" -e services/ticket -e services/notification
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q libs/common/tests services/ticket/tests services/notification/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Start notification stack on a clean broker
        run: docker compose up -d --wait notification-service
      - name: Apply migrations on an empty database
        run: docker compose up -d --wait ticket-service
      - name: Check migration version and model consistency
        run: |
          docker compose exec -T ticket-service alembic current
          docker compose exec -T ticket-service alembic check
      - name: Check ticket API through gateway
        run: |
          docker compose up -d --wait gateway
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          for path in ('/hello', '/api/v1/tickets?size=1'):
              request = Request('http://localhost' + path, headers={'X-Request-ID': 'ci-gateway'})
              with urlopen(request, timeout=15) as response:
                  assert response.status == 200
                  assert response.headers['X-Request-ID'] == 'ci-gateway'
                  json.load(response)
          for path in ('/health/ready', '/metrics', '/docs', '/api/v1/tickets-extra'):
              try:
                  urlopen('http://localhost' + path, timeout=10)
              except HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise AssertionError(path + ' must not be exposed')
          PY
      - name: Check Redis and PostgreSQL access boundaries
        run: bash scripts/check_data_access.sh
      - name: Test with PostgreSQL and Redis
        run: |
          # The one-off test container must not inherit ticket-service's fixed mon-net IP.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm --no-deps --user root \
            -e RUN_DATABASE_TESTS=1 \
            -e RUN_CACHE_TESTS=1 \
            -v "$PWD:/workspace:ro" \
            ticket-service sh -c '
              pip install pytest httpx &&
              cd /workspace &&
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/workspace/services/ticket:/workspace/libs/common \
              pytest -p no:cacheprovider -q libs/common/tests services/ticket/tests
            '
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose down
