name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/common[dev]" -e services/ticket
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q libs/common/tests services/ticket/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Apply migrations on an empty database
        run: docker compose up -d --wait ticket-service
      - name: Check migration version and model consistency
        run: |
          docker compose exec -T ticket-service alembic current
          docker compose exec -T ticket-service alembic check
      - name: Test with PostgreSQL
        run: |
          docker compose run --rm --no-deps --user root \
            -e RUN_DATABASE_TESTS=1 \
            -v "$PWD:/workspace:ro" \
            ticket-service sh -c '
              pip install pytest httpx &&
              cd /workspace &&
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/workspace/services/ticket:/workspace/libs/common \
              pytest -p no:cacheprovider -q libs/common/tests services/ticket/tests
            '
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose down
