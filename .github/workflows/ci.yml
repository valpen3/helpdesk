name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "libs/common[dev]" -e services/ticket -e services/notification -e services/sla
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q libs/common/tests services/ticket/tests services/notification/tests services/sla/tests scripts/tests

  compose:
    env:
      COMPOSE_PROJECT_NAME: helpdesk-ha-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate temporary JWT keys for Compose validation
        run: bash scripts/gen_keys.sh
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Start notification stack on a clean broker
        run: docker compose up -d --wait notification-service
      - name: Apply migrations on an empty database
        run: docker compose up -d --wait ticket-service
      - name: Start SLA service and apply its migration
        run: docker compose up -d --wait sla-service
      - name: Check SLA migration version and model consistency
        run: |
          docker compose exec -T sla-service alembic current
          docker compose exec -T sla-service alembic check
      - name: Check migration version and model consistency
        run: |
          docker compose exec -T ticket-service alembic current
          docker compose exec -T ticket-service alembic check
      - name: Apply auth migration
        run: docker compose up auth-migrate
      - name: Start auth service
        run: docker compose up -d --wait auth-service
      - name: Start gateway
        run: docker compose up -d --wait gateway
      - name: Check gateway ticket routes
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          for path in ('/hello', '/api/v1/tickets?size=1'):
              request = Request('http://localhost' + path, headers={'X-Request-ID': 'ci-gateway'})
              with urlopen(request, timeout=15) as response:
                  assert response.status == 200
                  assert response.headers['X-Request-ID'] == 'ci-gateway'
                  json.load(response)
          PY
      - name: Check hidden gateway routes
        run: |
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import urlopen

          for path in ('/health/ready', '/metrics', '/docs', '/api/v1/tickets-extra'):
              try:
                  urlopen('http://localhost' + path, timeout=10)
              except HTTPError as error:
                  assert error.code == 404, (path, error.code)
              else:
                  raise AssertionError(path + ' must not be exposed')
          PY
      - name: Check authentication through gateway
        run: |
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.request import urlopen

          for path in ('/api/v1/sla/policies', '/api/v1/users'):
              try:
                  urlopen('http://localhost' + path, timeout=10)
              except HTTPError as error:
                  assert error.code == 401, (path, error.code)
              else:
                  raise AssertionError(path + ' must require authentication')
          PY
      - name: Check Redis and PostgreSQL access boundaries
        run: bash scripts/check_data_access.sh
      - name: Test with PostgreSQL and Redis
        run: |
          # The one-off test container must not inherit ticket-service's fixed mon-net IP.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            run --rm --no-deps --user root \
            -e RUN_DATABASE_TESTS=1 \
            -e RUN_CACHE_TESTS=1 \
            -v "$PWD:/workspace:ro" \
            ticket-service sh -c '
              pip install pytest httpx &&
              cd /workspace &&
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONPATH=/workspace/services/ticket:/workspace/libs/common \
              pytest -p no:cacheprovider -q libs/common/tests services/ticket/tests
            '
      - name: Validate monitoring configuration
        run: |
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose --profile monitoring run --rm --no-deps --entrypoint promtool -v "$PWD/infra/prometheus:/rules:ro" -w /rules prometheus test rules alerts.test.yml
          docker compose --profile monitoring run --rm --no-deps --entrypoint amtool alertmanager check-config /etc/alertmanager/alertmanager.yml
      - name: Start monitoring and check collected data
        run: |
          docker compose --profile monitoring up -d
          python scripts/check_monitoring.py
      - name: Measure Redis and RabbitMQ failover with long-lived clients
        run: python scripts/failure_scenario.py --cycles 2
      - name: Upload measured failure journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-failure-results
          path: artifacts/ha-results/
          if-no-files-found: ignore
      - name: Container logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --no-color --tail=100
      - name: Annotate auth startup logs
        if: failure()
        run: |
          logs="$(docker compose logs --no-color --tail=60 auth-service auth-migrate | tr '\n' ';')"
          logs=${logs//'%'/'%25'}
          logs=${logs//$'\r'/'%0D'}
          printf '::error title=Auth startup log tail::%s\n' "$logs"
      - name: Stop test stack
        if: always()
        run: docker compose --profile monitoring down
