# HelpDesk — приложение, миграции и инфраструктура
name: helpdesk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------- участник A ----------------
  ticket-service:
    build: &ticket-build
      context: .
      dockerfile: services/ticket/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tickets_db
      DB_USER: tickets_user
      DB_PASSWORD: ${TICKETS_DB_PASSWORD:?задайте TICKETS_DB_PASSWORD в .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USER: ticket-svc
      REDIS_PASSWORD: ${TICKET_REDIS_PASSWORD:?Set TICKET_REDIS_PASSWORD in .env}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TIMEOUT: ${CACHE_TIMEOUT:-0.25}
      MQ_HOST: rabbitmq
      MQ_PORT: "5672"
      MQ_USER: ticket-svc
      MQ_PASSWORD: ${TICKET_MQ_PASSWORD:?Set TICKET_MQ_PASSWORD in .env}
      MQ_VHOST: /
      MQ_TIMEOUT: ${MQ_TIMEOUT:-5}
    networks:
      - edge
      - db-net
      - cache-net
      - broker-net
    depends_on:
      postgres:
        condition: service_healthy
      ticket-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # Одноразовая задача: применить миграции до запуска приложения.
  ticket-migrate:
    build: *ticket-build
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tickets_db
      DB_USER: tickets_user
      DB_PASSWORD: ${TICKETS_DB_PASSWORD:?задайте TICKETS_DB_PASSWORD в .env}
    command: ["alembic", "upgrade", "head"]
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # ---------------- участник A ----------------
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "hba_file=/var/lib/postgresql/pg_hba.conf"]
    networks:
      - db-net
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?задайте AUTH_DB_PASSWORD в .env}
      TICKETS_DB_PASSWORD: ${TICKETS_DB_PASSWORD:?задайте TICKETS_DB_PASSWORD в .env}
      SLA_DB_PASSWORD: ${SLA_DB_PASSWORD:?задайте SLA_DB_PASSWORD в .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      ticket-service:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["sh", "/usr/local/bin/start-redis.sh"]
    environment:
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:?Set AUTH_REDIS_PASSWORD in .env}
      TICKET_REDIS_PASSWORD: ${TICKET_REDIS_PASSWORD:?Set TICKET_REDIS_PASSWORD in .env}
      NOTIF_REDIS_PASSWORD: ${NOTIF_REDIS_PASSWORD:?Set NOTIF_REDIS_PASSWORD in .env}
      EXPORTER_REDIS_PASSWORD: ${EXPORTER_REDIS_PASSWORD:?Set EXPORTER_REDIS_PASSWORD in .env}
    restart: unless-stopped
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./infra/redis/users.acl.template:/usr/local/etc/redis/users.acl.template:ro
      - ./infra/redis/start.sh:/usr/local/bin/start-redis.sh:ro
      - redis-data:/data
    networks:
      - cache-net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$EXPORTER_REDIS_PASSWORD redis-cli --user exporter ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    entrypoint: ["sh", "/etc/rabbitmq/start.sh"]
    command: ["rabbitmq-server"]
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Set RABBITMQ_ADMIN_PASSWORD in .env}
      NOTIF_MQ_PASSWORD: ${NOTIF_MQ_PASSWORD:?Set NOTIF_MQ_PASSWORD in .env}
      TICKET_MQ_PASSWORD: ${TICKET_MQ_PASSWORD:?Set TICKET_MQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/start.sh:/etc/rabbitmq/start.sh:ro
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - broker-net
      - admin-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQ_HOST: rabbitmq
      MQ_USER: notif-svc
      MQ_PASSWORD: ${NOTIF_MQ_PASSWORD:?Set NOTIF_MQ_PASSWORD in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    networks:
      - broker-net
      - mail-net
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12)"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - mail-net
      - admin-net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  pg_data:
  redis-data:
  rabbitmq-data:

networks:
  edge:
  db-net:
    internal: true
    ipam:
      config:
        - subnet: 10.10.2.0/24
  cache-net:
    internal: true
  broker-net:
    internal: true
  mail-net:
    internal: true
  admin-net:
