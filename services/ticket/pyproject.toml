[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "helpdesk-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
