[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "helpdesk-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "redis>=5,<6",
    "argon2-cffi>=23.1,<26",
    "PyJWT[crypto]>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
