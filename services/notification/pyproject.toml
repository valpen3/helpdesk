[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notification-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "helpdesk-common",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "email-validator>=2.1,<3",
    "aio-pika>=9.5,<10",
    "aiosmtplib>=5,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["helpdesk_notification"]
