global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: services
    static_configs:
      - targets: [auth-service:8000, ticket-service:8000, notification-service:8000]
  - job_name: sla
    static_configs:
      - targets: [sla-service:8000]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692, rabbitmq-2:15692, rabbitmq-3:15692]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: [redis://redis:6379, redis://redis-replica-1:6379, redis://redis-replica-2:6379]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121
  - job_name: sentinel
    metrics_path: /scrape
    static_configs:
      - targets: [redis://sentinel-1:26379, redis://sentinel-2:26379, redis://sentinel-3:26379]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: sentinel-exporter:9121
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway/health
          - http://auth-service:8000/health/ready
          - http://ticket-service:8000/health/ready
          - http://sla-service:8000/health/ready
          - http://notification-service:8000/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
