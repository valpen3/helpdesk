# Listen inside the Docker network. No port is published on the host.
bind 0.0.0.0
port 6379
# ACL users are generated from environment secrets by start.sh.
protected-mode yes

# Store persistence files in the named Docker volume mounted at /data.
dir /data
appendonly yes
appendfsync everysec

# Evict least recently used keys with a TTL; retain keys without a TTL.
maxmemory 256mb
maxmemory-policy volatile-lru
