global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend postgres_front
    bind :5432
    default_backend postgres_nodes

backend postgres_nodes
    option tcp-check
    default-server inter 2s fall 3 rise 2
    server primary postgres:5432 check
    server replica postgres-replica:5432 check backup
