# Local socket connections are used by image initialization and health checks.
local all all trust

# Services reach PostgreSQL only through db-net (10.10.2.0/24).
host tickets_db tickets_user 10.10.2.0/24 scram-sha-256
host auth_db auth_user 10.10.2.0/24 scram-sha-256
host sla_db sla_user 10.10.2.0/24 scram-sha-256

# Deny all other TCP clients, including access to another service's database.
host all all 0.0.0.0/0 reject
host all all ::/0 reject
