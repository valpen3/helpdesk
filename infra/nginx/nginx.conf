user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_x_request_id $forwarded_request_id {
        "" $request_id;
        default $http_x_request_id;
    }
    log_format request_json escape=json
        '{"request_id":"$forwarded_request_id","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr"}';
    access_log /dev/stdout request_json;

    # Docker DNS: refresh the service address when its container changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream ticket_upstream {
        zone ticket_upstream 64k;
        server ticket-service:8000 resolve;
    }

    server {
        listen 80;
        server_name _;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $forwarded_request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /health {
            default_type text/plain;
            access_log off;
            return 200 "ok\n";
        }

        location = /hello {
            proxy_pass http://ticket_upstream;
        }

        # Без завершающего / в proxy_pass: исходный путь сохраняется.
        location ~ ^/api/v1/tickets(?:/|$) {
            proxy_pass http://ticket_upstream;
        }

        location / {
            return 404;
        }
    }
}
