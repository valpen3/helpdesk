user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map "$request_method:$uri" $auth_rate_key {
        default "";
        "~^POST:/api/v1/auth/(login|register)$" $binary_remote_addr;
    }
    map $request_method $ticket_create_rate_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $auth_rate_key zone=auth_per_ip:10m rate=5r/m;
    limit_req_zone $ticket_create_rate_key zone=ticket_create_per_ip:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    map $http_x_request_id $forwarded_request_id {
        "" $request_id;
        default $http_x_request_id;
    }
    log_format request_json escape=json
        '{"request_id":"$forwarded_request_id","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"upstream":"$upstream_addr"}';
    access_log /dev/stdout request_json;

    # Docker DNS: refresh the service address when its container changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    upstream ticket_upstream {
        zone ticket_upstream 64k;
        server ticket-service:8000 resolve;
    }

    upstream sla_upstream {
        zone sla_upstream 64k;
        server sla-service:8000 resolve;
    }

    server {
        listen 80;
        server_name _;
        set $auth_service auth-service:8000;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn connections_per_ip 20;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $forwarded_request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        location = /health {
            default_type text/plain;
            access_log off;
            return 200 "ok\n";
        }

        location = /hello {
            proxy_pass http://ticket_upstream;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_per_ip burst=3 nodelay;
            proxy_pass http://$auth_service;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth_per_ip burst=3 nodelay;
            proxy_pass http://$auth_service;
        }

        location ~ ^/api/v1/auth(?:/|$) {
            proxy_pass http://$auth_service;
        }

        location ~ ^/api/v1/users(?:/|$) {
            proxy_pass http://$auth_service;
        }

        location = /api/v1/tickets {
            limit_req zone=ticket_create_per_ip burst=5 nodelay;
            proxy_pass http://ticket_upstream;
        }

        # Без завершающего / в proxy_pass: исходный путь сохраняется.
        location ~ ^/api/v1/tickets(?:/|$) {
            proxy_pass http://ticket_upstream;
        }

        location ~ ^/api/v1/sla(?:/|$) {
            proxy_pass http://sla_upstream;
        }

        location / {
            return 404;
        }
    }
}
